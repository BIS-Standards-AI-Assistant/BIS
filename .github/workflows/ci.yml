name: CI

on:
  push:
    branches: [master, production, client]
  pull_request:
    branches: [master, production, client]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tsc needs .next/types (route/layout prop types), which only exists
      # after a build or dev run has generated it — a fresh checkout has
      # neither, so this step exists specifically to unblock the typecheck
      # step below without running a full build first.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Deterministic ML pipeline suites + vitest unit suite. DB-independent
      # (no DATABASE_URL in CI) — this is the same "test" script run locally.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Reports known vulnerabilities in production dependencies; does not
      # fail the workflow on its own (advisories on transitive deps are
      # common and often not actionable same-day) but makes them visible in
      # every run instead of only when someone remembers to check manually.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # Cheap, dependency-free guard against committing an obvious live
      # secret (API-key-shaped strings). Not a substitute for a real secret
      # scanner, but catches the common case for free.
      - name: Secret pattern scan
        run: |
          if git grep -InE "sk-or-v1-[A-Za-z0-9]{10,}|sk-proj-[A-Za-z0-9]{10,}|AIzaSy[A-Za-z0-9_-]{25,}|ghp_[A-Za-z0-9]{30,}" -- . ':!package-lock.json'; then
            echo "Possible live secret found in tracked source — see matches above." >&2
            exit 1
          fi
